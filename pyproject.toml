[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-video-review"
version = "0.1.0"
description = "Review and manually align multi-camera OpenCap videos with pose overlays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.scripts]
pose-video-review = "pose_video_review.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pose_video_review = ["static/*"]
